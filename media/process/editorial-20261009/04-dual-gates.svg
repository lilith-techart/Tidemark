<text x="70" y="858" fill="#8daeb8" font-size="16">ORIGINAL EDITORIAL SCHEMATIC  •  NOT AN ACTUAL BLENDER / UE CAPTURE</text><text x="1520" y="858" text-anchor="end" fill="#7ee1cb" font-size="18">UE_TIDEMARK  /  2026</text></g><rect x="70" y="261" width="712" height="485" rx="18" fill="#102e3d" stroke="#325968" stroke-width="2"/><rect x="806" y="261" width="723" height="485" rx="18" fill="#102e3d" stroke="#325968" stroke-width="2"/><rect x="105" y="299" width="640" height="87" rx="14" fill="#1a493e"/><text x="138" y="341" font-size="29" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#b5f9e5">ENGINEERING GATE</text><text x="138" y="375" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="500" fill="#eef5f3">G016.1 / technical checks</text><circle cx="136" cy="440" r="12" fill="#71e1bd"/><text x="166" y="449" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="500" fill="#eef5f3">Blend / FBX independent reload</text><circle cx="136" cy="505" r="12" fill="#71e1bd"/><text x="166" y="514" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="500" fill="#eef5f3">Mesh finite / manifold / no degenerate faces</text><circle cx="136" cy="570" r="12" fill="#71e1bd"/><text x="166" y="579" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="500" fill="#eef5f3">Limited self-intersection risk check</text><circle cx="136" cy="635" r="12" fill="#71e1bd"/><text x="166" y="644" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="500" fill="#eef5f3">813 protected originals reported unchanged</text><rect x="837" y="299" width="658" height="87" rx="14" fill="#543b32"/><text x="866" y="341" font-size="29" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#ffe0b7">ART RETENTION GATE</text><text x="866" y="375" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="500" fill="#eef5f3">G016.1 / not passed</text><circle cx="868" cy="440" r="12" fill="#f0b681"/><text x="897" y="449" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="500" fill="#eef5f3">Cliff silhouette remains plate-like</text><circle cx="868" cy="505" r="12" fill="#f0b681"/><text x="897" y="514" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="500" fill="#eef5f3">Shoulder mass reads as a wedge</text><circle cx="868" cy="570" r="12" fill="#f0b681"/><text x="897" y="579" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="500" fill="#eef5f3">Medium-scale form is insufficient</text><circle cx="868" cy="635" r="12" fill="#f0b681"/><text x="897" y="644" font-size="21" font-family="Arial,Helvetica,sans-serif" font-weight="500" fill="#eef5f3">Production-ready rock kit = NO</text><rect x="88" y="760" width="1419" height="50" rx="18" fill="#102e3d" stroke="#325968" stroke-width="2"/><text x="114" y="792" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#7ee1cb">LATEST RETAINED SCENE:</text><text x="415" y="792" font-size="23" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#eef5f3">G012</text><text x="697" y="792" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#f0be87">HUMAN ART: PENDING</text><text x="1200" y="792" font-size="20" font-family="Arial,Helvetica,sans-serif" font-weight="700" fill="#f0be87">PROMOTION: NO</text></svg>